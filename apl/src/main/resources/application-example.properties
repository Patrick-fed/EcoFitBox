# ===================================================================
# EcoFit API - Exemplo de configuração
# Cópia este arquivo como application.properties e preencha os valores
# ===================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/banco_ecofit
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.application.name=ecofit-apl

# Gere uma chave com: openssl rand -base64 32
jwt.secret=coloque-aqui-uma-chave-secreta-de-no-minimo-32-caracteres
jwt.expiration=86400000

server.port=65009

# Gere uma chave AES-256 com: openssl rand -base64 32
payment.encryption.key=coloque-uma-chave-aes-256-em-base64-aqui
