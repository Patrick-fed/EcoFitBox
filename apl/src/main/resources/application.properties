spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

spring.application.name=ecofit-apl

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:65009}

payment.encryption.key=${PAYMENT_ENCRYPTION_KEY}

firebase.service-account=${FIREBASE_SERVICE_ACCOUNT_PATH:src/main/resources/ecofit-51ca9-firebase-adminsdk-fbsvc-a0b3593296.json}
